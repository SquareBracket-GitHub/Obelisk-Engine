name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      # Hosted runners have no playback device. Exercise the real SDL stream API
      # with its clocked dummy device; audible hardware quality is a separate gate.
      SDL_AUDIODRIVER: dummy

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore Obelisk.sln

      - name: Verify formatting
        run: dotnet format Obelisk.sln --no-restore --verify-no-changes

      - name: Build Release
        run: dotnet build Obelisk.sln -c Release --no-restore

      - name: Test Release
        run: dotnet test Obelisk.sln -c Release --no-build --no-restore

      - name: Verify native terminal debug control
        run: python tests/Obelisk.Cli.Tests/Verify-DebugControl.py --configuration Release
